<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraCloud</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="static/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.20/dist/fetch.umd.min.js"></script>
</head>
<body>
    <header>
        <div class="maintenance"><h3>W przypadku utraty dostępu do konta, należy zarejestrować się ponownie w celu odzyskania dostępu do plików.</h3></div>
        <div class="head">
            <a href="astracloud"><img src="static/img/astracloud_logo.svg" alt="astra" width="200"></a>
        </div>
        <nav>
            <p><a href="astracloud">Strona główna</a></p>
            <p id="diskHeaderAction"><a href="account">Dysk</a></p>
            <p id="loginHeaderAction"><a href="login">Logowanie</a></p>
            <p id="registerHeaderAction"><a href="register">Rejestracja</a></p>
            <p id="logoutHeaderAction"><a href="logout">Wyloguj</a></p>
        </nav>
    </header>
    <main>
        <div class="myForm">
        <form id="loginForm" method="POST">
            <legend>Logowanie</legend><br>
            <input type="text" name="loginData" id="loginData" placeholder="adres e-mail lub login..." required /><br>
            <input type="password" name="password" id="password" required placeholder="hasło..." minlength="8" /><br>
            <button type="submit">Zaloguj</button><br>
            <script src="static/main_login.js"></script>
        </form>
        <div id="jsCode"></div>
	</div>
    </main>
    <footer>
        <script src="static/version.js"></script>
    </footer>
    <script src="static/headerHandler.js"></script>
</body>
</html>
